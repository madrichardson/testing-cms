media:
  input: images
  output: /images

content:
  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.yml
    fields:
      - name: title
        label: Page Title
        type: string

      - name: description
        label: Description
        type: text

      - name: status
        label: Project Status
        type: select
        options:
          values:
            - Active
            - In Development
            - Archived
  - name: projects
    label: Projects
    type: file
    path: content/projects.yml
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - name: name
            label: Project Name
            type: string

          - name: status
            label: Status
            type: select
            options:
              values:
                - Active
                - In Development
                - Archived

          - name: last_updated
            label: Last Updated
            type: string     
