media:
  input: images
  output: /images

content:
  - name: homepage
    label: Homepage
    type: file
    path: content/homepage.yml
    fields:
      - name: title
        label: Page Title
        type: string

      - name: description
        label: Description
        type: text

      - name: status
        label: Project Status
        type: select
        options:
          values:
            - Active
            - In Development
            - Archived
  - name: projects
    label: Projects
    type: file
    path: content/projects.yml
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - name: name
            label: Project Name
            type: string

          - name: status
            label: Status
            type: select
            options:
              values:
                - Active
                - In Development
                - Archived

          - name: last_updated
            label: Last Updated
            type: string     
  - name: applications
    label: Applications
    type: collection
    path: content/applications
    format: yaml
    filename: "{primary}.yml"

    view:
      fields:
        - project_name
        - category_title
        - image

    fields:
      - name: project_name
        label: Project Name
        type: string
        required: true

      - name: category_title
        label: Category Title
        type: string

      - name: image
        label: Project Image
        type: image

      - name: alt
        label: Image Alt Text
        type: string

      - name: caption
        label: Image Caption
        type: text

      - name: partners
        label: Partners
        type: text

      - name: description
        label: Project Description
        type: text

      - name: funding
        label: Funding
        type: text

      - name: homepage_url
        label: External Homepage URL
        type: string

      - name: project_href
        label: Internal Project Page
        type: string

      - name: modal_id
        label: Modal ID
        type: string

      - name: order
        label: Display Order
        type: number
