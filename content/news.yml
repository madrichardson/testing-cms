news:
- title: 'Job Opportunity: Satellite Product Modeler'
  description: UCSC is seeking a Satellite Product Modeler. To view and apply for the job, go to https://jobs.ucsc.edu/. Click on the External or Internal Candidate Gateway. Enter the ID 80980 to the “Search Jobs” field.
  date: '2025-09-08'
  expiration: '2026-02-24'
- title: Monthly NOAA Gridded Super-collated SST
  description: A monthly version of the NOAA Gridded Super-collated SST is available on ERDDAP.
  date: '2025-08-28'
  expiration: null
- title: Version 2 of Sardine Habitat Model
  description: 'Version 2 of the Sardine Habitat Model, based on either <a href="https://coastwatch.pfeg.noaa.gov/erddap/griddap/sardine_habitat_modis_v2.graph" target="_blank">MODIS</a> or <a href="https://coastwatch.pfeg.noaa.gov/erddap/griddap/sardine_habitat_viirs_v2.graph" target="_blank">VIIRS</a>, are available on ERDDAP. '
  date: '2025-08-28'
  expiration: null
- title: ERDDAP Showcase
  description: 'ERDDAP <a href="https://groups.google.com/g/erddap-announce/c/ovR5iHQqrsc/m/iffbTSTLKAAJ" target="_blank">Showcase</a>: Showing off work done by Google Summer of Code contributors and the community. September 23 · 9:00 – 10:00am, Pacific Time. '
  date: '2025-08-26'
  expiration: null
- title: VIIRS Primary Productivity Datasets
  description: 'Primary productivity <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=productivity_viirs_noaa20_" target="_blank">datasets</a> (daily and monthy) based on VIIRS data are available on ERDDAP. '
  date: '2025-08-15'
  expiration: null
- title: Decomissioning of NOAA Satellites in the Legacy POES Constellation
  description: 'The remaining NOAA satellites in the legacy <a href="https://www.ospo.noaa.gov/operations/poes/status.html" target="_blank">POES constellation</a> will be decommissioned. The decommissioning may impact coverage on the <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=erdATsst" target="_blank">POES AVHRR SST datasets</a>. '
  date: '2025-08-01'
  expiration: null
- title: Updated Sardine Habitat Model
  description: An updated version of the <a href="https://coastwatch.pfeg.noaa.gov/erddap/griddap/sardine_habitat_modis_v2.graph" target="_blank">Sardine Habitat Model</a> is available on ERDDAP.
  date: '2025-07-16'
  expiration: null
- title: 'Job Opportunity: Cloud Specialist'
  description: '<a href="https://coastwatch.pfeg.noaa.gov/info/UCSC_CW_ProjSci_Flyer2025_v2.pdf" target="_blank">Job opportunity</a> at UCSC: Cloud migration of environmental data.'
  date: '2025-06-27'
  expiration: null
- title: 'Job Opportunity: Development Assistant '
  description: '<a href="https://coastwatch.pfeg.noaa.gov/info/UCSC_CW_Specialist_Flyer2025_V2.pdf" target="_blank">Job opportunity</a> at UCSC: Development assistant for satellite products.'
  date: '2025-06-27'
  expiration: null
- title: New Publication on Alexandrium catenella Blooms
  description: 'Check out the <a href="https://doi.org/10.1016/j.jenvman.2025.125042" target="_blank">new paper</a> with CoastWatch West Coast co-authors: Application of dinoflagellate-specific satellite models to aid Alexandrium catenella bloom monitoring in the Bering and Chukchi seas.'
  date: '2025-03-24'
  expiration: null
- title: Spray Glider Dataset from Scripps
  description: The <a href="https://coastwatch.pfeg.noaa.gov/wcn/erddap/tabledap/scrippsGlidersSQ.graph" target="_blank">Spray Glider dataset</a> from Scripps Institution of Oceanography is available for download on ERDDAP.
  date: '2025-03-14'
  expiration: null
- title: CoastWatch West Code Node Projects Dashboard
  description: Visit the CoastWatch West Coast Node (WCN) <a href="https://coastwatch.pfeg.noaa.gov/projects" target="_blank">projects dashboard</a> for descriptions of and links to WCN projects.
  date: '2025-02-21'
  expiration: null
- title: High Resolution (750m) SST Datasets Available
  description: High resolution (750 m) SST datasets for US West Coast and Alaska waters are available for download.
  date: '2025-01-06'
  expiration: null
