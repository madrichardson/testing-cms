  description: CoastWatch held an Ocean Satellite Data Course on March 25-29, 2024. The course was tailored for participants in Micronesia, but anyone was welcome to attend.
  date: '2024-07-01'
  expiration: null
- title: Dr. Cara Wilson Presents at GOOS ERDDAP Seminar Series
  description: Dr. Cara Wilson, the West Coast Node federal manager, will present <a href="https://us06web.zoom.us/webinar/register/WN_suWrw9xsQsmFs0E9hrPhZA#/registration" target="_blank">’How to access ERDDAP data using R’</a> on June 20, 2024 at the GOOS ERDDAP Seminar Series.
  date: '2024-06-05'
  expiration: null
- title: CoastWatch Annual Meeting in College Park, MD
  description: The CoastWatch Annual Meeting was held on May 20-23, 2024 in Collage Park, MD.
  date: '2024-05-24'
  expiration: null
- title: New Primary Productivity Product Available on ERDDAP
  description: A new <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=productivity_viirs_snpp" target="_blank">Primary Productivity Product</a> is available on ERDDAP. The product is based on VIIRS data and it replaces the <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=erdMH1pp" target="_blank">legacy MODIS-based</a> product.
  date: '2024-05-01'
  expiration: null
- title: ESA CCI Ocean Colour Product Version 6.0 Available on ERDDAP
  description: Version 6.0 of the <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=pmlEsaCCI6" target="_blank">ESA CCI Ocean Colour Product</a> is available on ERDDAP, providing over 60 ocean color products at daily, 8-day, and monthly intervals.
  date: '2023-09-01'
  expiration: null
- title: MODIS Data has Been Reprocessed (R2022)
  description: 'MODIS data has been reprocessed (R2022). Datasets using pre-R2022 data are no long being updated. The <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=R2022" target="_blank">R2022 version of MODIS dataset</a> can be accessed on ERDDAP. '
  date: '2023-08-22'
  expiration: null
- title: 'Job Opportunity: Development Assistant'
  description: 'Position opening with CoastWatch for a <a href="https://coastwatch.pfeg.noaa.gov/info/CoastWatch_Specialist_Flyer_202305.pdf" target="_blank">Development Assistant</a> for satellite-based ocean products. The application deadline has passed (May 25, 2023), but applications will be accepted until the position is filled. '
  date: '2023-05-25'
  expiration: null
- title: Arctic Report Card 2022
  description: 'Arctic <a href="https://www.arctic.noaa.gov/Report-Card/Report-Card-2022" target="_blank">Report Card 2022</a>: shifting seasons, widespread disturbances, and the value of diverse observations.'
  date: '2023-02-13'
  expiration: null
- title: ERDDAP Update
  description: <a href="https://erddap.github.io/changes" target="_blank">Version notes</a> and instructions for <a href="https://erddap.github.io/docs/server-admin/deploy-install" target="_blank">downloading and installing</a> are available for ERDDAP ver 2.22.
  date: '2022-12-15'
  expiration: null
- title: NOAA JPSS-2 Launched
  description: NOAA’s Joint Polar Satellite System-2 (JPSS-2) launched from California’s Vandenberg Space Force Base on Nov. 10, 2022.
  date: '2022-11-10'
  expiration: null
- title: Instruments Aboard SNPP in Safe Mode and Not Transmitting Data
  description: All instruments aboard the SNPP spacecraft (including VIIRS) are in <a href="https://coastwatch.noaa.gov/cw/node/295.html" target="_blank">safe mode and not transmitting data</a>.
  date: '2022-07-27'
  expiration: null
- title: Data Flow to MODIS Aqua Products Restored
  description: Data flow to the MODIS Aqua products has been restored. The Aqua sensor is nearing its end of life. Please consider switchig to products based on other sensors e.g. <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=viirs+chl" target="_blank">VIIRS</a>.
  date: '2022-04-25'
  expiration: null
- title: MODIS Aqua Sensor Not Producing Science Data
  description: The MODIS Aqua sensor is not producing science data. All of the MODIS Aqua prducts in our ERDDAP catalog are impacted. The <a href="https://ladsweb.modaps.eosdis.nasa.gov/alerts-and-issues/?id=82965" target="_blank">cause of the anomaly is under investigation</a>.
  date: '2022-03-30'
  expiration: null
- title: MODIS Aqua Mission Ending October 31, 2022
  description: MODIS Aqua mission will end October 31, 2022 and at that time satellite products from the sensor will will no long be produced.
  date: '2022-03-25'
  expiration: null
- title: Version 1 of C-HARM Forecast Dataset replaced by Version 2
  description: <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=C-HARM+v1" target="_blank">Version 1</a> of the C-HARM harmful algal bloom forecast dataset has been discontinued and has been replace by <a href="https://coastwatch.pfeg.noaa.gov/erddap/search/index.html?page=1&amp;itemsPerPage=1000&amp;searchFor=C-HARM+v2" target="_blank">Version 2</a>.
  date: '2022-03-22'
  expiration: null
