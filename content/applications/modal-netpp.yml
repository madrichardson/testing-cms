description: NOAA CoastWatch developed interim primary productivity products to
  bridge the gap created by the upcoming retirement of the MODIS-Aqua sensor,
  which has supported the legacy global product since 2007. These interim
  products, driven by VIIRS-SNPP and VIIRS-NOAA20 data using the established
  VPGM algorithm, provide continuity for users until the next generation of
  primary productivity products is available. TESTING
funding: The project was supported by funding from the Portfolio Management
  Branch of NESDIS, NOAA CoastWatch, and CSU COAST. TESTING
